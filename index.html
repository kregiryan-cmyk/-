<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0b1220;
    color: #e8eefb;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 14px calc(30px + env(safe-area-inset-bottom)); }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    margin: 0 -14px; padding: calc(11px + env(safe-area-inset-top)) 14px 11px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(11, 18, 32, .93);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #16233a;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: #dbe4f2; min-width: 0; }
  .brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(180deg, #93c5fd, #818cf8); box-shadow: 0 0 10px rgba(147, 197, 253, .7); flex: 0 0 auto; }
  .pill {
    flex: 0 0 auto; font-size: 11.5px; font-weight: 700; color: #bfdbfe;
    background: rgba(147, 197, 253, .12); border: 1px solid rgba(147, 197, 253, .3);
    border-radius: 999px; padding: 6px 11px; font-family: inherit; cursor: pointer;
  }
  .pill:active { background: rgba(147, 197, 253, .22); }

  /* date nav */
  .datenav { display: flex; align-items: center; gap: 8px; margin: 14px 0 12px; }
  .nav-btn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
    background: #17233a; border: 1px solid #25354f; color: #cbd5e1;
    font-size: 20px; line-height: 1; font-family: inherit; cursor: pointer;
    display: grid; place-items: center; padding: 0 0 3px;
  }
  .nav-btn:active { background: #1d2b45; }
  .nav-btn[disabled] { opacity: .28; cursor: default; }
  .day-label { flex: 1; text-align: center; font-size: 17.5px; font-weight: 800; letter-spacing: -.3px; color: #f2f6ff; }

  /* progress */
  .progress { display: flex; align-items: center; gap: 10px; }
  .track { flex: 1; height: 6px; border-radius: 999px; background: #1b2740; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #93c5fd, #a5b4fc); transition: width .35s ease; }
  .counter { font-size: 12px; color: #8fa0bb; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .summary { margin: 11px 0 15px; font-size: 13px; line-height: 1.5; color: #8fa0bb; }

  /* main card */
  .card {
    background: #141e31; border: 1px solid #2a3b57; border-radius: 18px;
    padding: 18px 16px 16px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    animation: cardIn .28s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card-eyebrow { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: #8b9ab5; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    color: #c7d9ff; background: #1c2b45; border: 1px solid #2c405f; padding: 4px 10px; border-radius: 999px;
  }
  .badge.done { color: #bbf7d0; background: rgba(52, 211, 153, .12); border-color: rgba(52, 211, 153, .35); }
  .card-title { margin: 12px 0 9px; font-size: 22px; line-height: 1.33; font-weight: 800; letter-spacing: -.4px; color: #f2f6ff; }
  .card-why { margin: 0 0 16px; font-size: 13.5px; line-height: 1.62; color: #93a3bd; }

  /* steps */
  .steps { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
  .step {
    display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left;
    background: #1e2939; border: 1px solid #2a394c; border-radius: 12px;
    padding: 13px; color: #dfe7f4; font-size: 14.5px; line-height: 1.5;
    font-family: inherit; cursor: pointer; transition: background .18s, border-color .18s;
  }
  .step:active { background: #243247; }
  .step .box {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 7px; margin-top: 1px;
    background: #3a475c; border: 1px solid #4b5b72; position: relative; transition: background .18s, border-color .18s;
  }
  .step.done .box { background: linear-gradient(180deg, #a5b4fc, #93c5fd); border-color: #a5b4fc; }
  .step.done .box::after {
    content: ""; position: absolute; left: 6.5px; top: 2.5px; width: 6px; height: 11px;
    border: solid #0b1220; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .step .txt { flex: 1; min-width: 0; }
  .step .num { color: #9fb0c9; font-weight: 700; }
  .step.done .txt { color: #7f8ea6; }
  .step.done .num { color: #7f8ea6; }

  /* links */
  .link {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin: 0 0 8px; padding: 13px 14px; border-radius: 12px;
    background: rgba(147, 197, 253, .1); border: 1px solid rgba(147, 197, 253, .3);
    color: #c7dcff; font-size: 14px; font-weight: 700; text-decoration: none;
  }
  .link:active { background: rgba(147, 197, 253, .18); }
  .link .arrow { font-size: 12px; opacity: .8; }

  /* copy blocks */
  .copy { background: #1b2637; border: 1px solid #2b3a4e; border-radius: 12px; padding: 13px; margin: 0 0 10px; }
  .copy-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 9px; }
  .copy-label { font-size: 11.5px; font-weight: 700; color: #93a3bd; letter-spacing: .01em; }
  .copy-btn {
    font-size: 11.5px; font-weight: 700; color: #dbe7fb; background: #26374f;
    border: 1px solid #35496a; border-radius: 9px; padding: 6px 11px;
    font-family: inherit; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  }
  .copy-btn:active { background: #2e4160; }
  .copy-btn.copied { background: rgba(52, 211, 153, .18); border-color: rgba(52, 211, 153, .45); color: #bbf7d0; }
  .copy-text {
    margin: 0; font-size: 13px; line-height: 1.62; color: #c2cee1;
    white-space: pre-wrap; word-break: break-word; font-family: inherit;
    max-height: 248px; overflow: auto; -webkit-overflow-scrolling: touch;
  }

  /* call to action */
  .cta {
    margin-top: 6px; width: 100%; padding: 17px 16px; border: 0; border-radius: 14px;
    background: linear-gradient(180deg, #b6c2ff, #9db4fd); color: #101a2c;
    font-size: 16px; font-weight: 800; letter-spacing: -.2px; font-family: inherit; cursor: pointer;
    box-shadow: 0 10px 24px rgba(129, 140, 248, .28);
  }
  .cta:active { transform: translateY(1px); }
  .cta.secondary { background: #22304a; color: #cfe0ff; border: 1px solid #33486a; box-shadow: none; margin-top: 10px; }
  .cta.ghost { background: transparent; color: #8fa0bb; border: 1px solid #26344a; box-shadow: none; margin-top: 8px; font-weight: 700; font-size: 14px; padding: 14px; }

  /* all done */
  .done-card { text-align: center; padding: 26px 18px 20px; }
  .check-big {
    width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; font-size: 28px; color: #0b1220;
    background: linear-gradient(180deg, #86efac, #34d399); box-shadow: 0 10px 26px rgba(52, 211, 153, .3);
  }
  .done-card .card-title { margin: 0 0 8px; font-size: 20px; }
  .done-card .card-why { margin: 0 0 6px; }

  /* today list */
  .all { margin-top: 26px; }
  .all-title { margin: 0 0 10px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; color: #7f8ea6; }
  .all-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .all-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: #131c2d; border: 1px solid #202e45; border-radius: 12px; padding: 12px;
    text-align: left; font-family: inherit; color: #cdd8e8; font-size: 13.5px; line-height: 1.45; cursor: pointer;
  }
  .all-item:active { background: #182338; }
  .all-item.current { border-color: #4a5f86; background: #182338; }
  .all-time { flex: 0 0 30px; font-size: 11px; font-weight: 700; color: #7f8ea6; }
  .all-text { flex: 1; min-width: 0; }
  .all-status { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; color: #8fa0bb; }
  .all-status.now { color: #a5b4fc; }
  .all-status.done { color: #6ee7b7; }

  .foot { margin: 26px 0 0; text-align: center; font-size: 11.5px; line-height: 1.6; color: #5d6b82; }

  /* sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end;
    background: rgba(4, 8, 16, .62);
    padding: 14px;
  }
  .sheet[hidden] { display: none; }
  .sheet-box {
    width: 100%; max-width: 452px; margin: 0 auto;
    background: #162033; border: 1px solid #2a3b57; border-radius: 18px;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet-box h3 { margin: 0 0 10px; font-size: 16px; font-weight: 800; color: #f2f6ff; }
  .sheet-box p { margin: 0 0 9px; font-size: 13.5px; line-height: 1.65; color: #93a3bd; }
  .btn-ghost {
    width: 100%; margin-top: 8px; padding: 14px; border-radius: 12px;
    background: #22304a; border: 1px solid #33486a; color: #cfe0ff;
    font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'brl-today-v1';

  var allStore = {};
  try { allStore = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { allStore = {}; }

  var state = { days: [], index: 0, selected: null, store: {} };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(allStore)); } catch (e) {}
  }
  function storeFor(date) {
    if (!allStore[date]) allStore[date] = {};
    return allStore[date];
  }
  function todaySeoul() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      var d = new Date(Date.now() + 9 * 3600 * 1000);
      return d.toISOString().slice(0, 10);
    }
  }

  function day() { return state.days[state.index]; }
  function ts(id) {
    if (!state.store[id]) state.store[id] = {};
    return state.store[id];
  }
  function isDone(task) {
    var s = state.store[task.id];
    return !!(task.preCompleted || (s && s.done));
  }
  function stepDone(task, i) {
    var s = state.store[task.id];
    if (s && s.steps && typeof s.steps[i] === 'boolean') return s.steps[i];
    return !!task.preCompleted;
  }
  function currentTask() {
    var d = day();
    if (!d) return null;
    if (state.selected) {
      for (var i = 0; i < d.tasks.length; i++) if (d.tasks[i].id === state.selected) return d.tasks[i];
    }
    for (var j = 0; j < d.tasks.length; j++) if (!isDone(d.tasks[j])) return d.tasks[j];
    return null;
  }

  /* ---------- rendering ---------- */

  function cardHTML(task) {
    if (!task) return doneHTML();
    var doneTask = isDone(task);
    var h = '';
    h += '<article class="card">';
    h += '<p class="card-eyebrow">' + (doneTask ? '끝낸 일' : '지금 할 일') + '</p>';
    h += '<div class="badges"><span class="badge">' + esc(task.badge || task.time) + '</span>';
    if (task.preCompleted) h += '<span class="badge done">피클 완료 ✓</span>';
    else if (doneTask) h += '<span class="badge done">완료 ✓</span>';
    h += '</div>';
    h += '<h1 class="card-title">' + esc(task.title) + '</h1>';
    if (task.why) h += '<p class="card-why">' + esc(task.why) + '</p>';

    if (task.steps && task.steps.length) {
      h += '<div class="steps">';
      for (var i = 0; i < task.steps.length; i++) {
        var on = stepDone(task, i);
        h += '<button type="button" class="step' + (on ? ' done' : '') + '" data-step="' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
             '<span class="box" aria-hidden="true"></span>' +
             '<span class="txt"><span class="num">' + (i + 1) + '.</span> ' + esc(task.steps[i]) + '</span></button>';
      }
      h += '</div>';
    }

    if (task.links && task.links.length) {
      for (var l = 0; l < task.links.length; l++) {
        h += '<a class="link" href="' + esc(task.links[l].url) + '" target="_blank" rel="noopener noreferrer">' +
             esc(task.links[l].label) + '<span class="arrow" aria-hidden="true">↗</span></a>';
      }
    }

    if (task.copies && task.copies.length) {
      for (var c = 0; c < task.copies.length; c++) {
        h += '<div class="copy"><div class="copy-head"><span class="copy-label">' + esc(task.copies[c].label) + '</span>' +
             '<button type="button" class="copy-btn" data-copy="' + c + '">복사하기</button></div>' +
             '<pre class="copy-text">' + esc(task.copies[c].text) + '</pre></div>';
      }
    }

    if (doneTask) {
      h += '<button type="button" class="cta" data-act="next">다음 일로 →</button>';
    } else {
      h += '<button type="button" class="cta" data-act="finish">이 일 끝났어요 → 다음 일</button>';
    }
    h += '</article>';
    return h;
  }

  function doneHTML() {
    var d = day();
    var n = d ? d.tasks.length : 0;
    return '<article class="card done-card">' +
      '<div class="check-big" aria-hidden="true">✓</div>' +
      '<h1 class="card-title">' + esc(d ? d.label : '오늘') + ' 할 일 다 끝났어요</h1>' +
      '<p class="card-why">' + n + '개 전부 완료! 남은 시간은 내일 준비에 쓰면 돼요.</p>' +
      '<button type="button" class="cta secondary" data-act="review">완료한 일 다시 보기</button>' +
      '<button type="button" class="cta ghost" data-act="reset">체크 다시 하기</button>' +
      '</article>';
  }

  function renderCard() {
    $('cardHost').innerHTML = cardHTML(currentTask());
  }

  function statusOf(task, cur) {
    if (task.preCompleted) return { cls: 'done', label: '피클 완료 ✓' };
    if (isDone(task)) return { cls: 'done', label: '완료 ✓' };
    if (cur && task.id === cur.id) return { cls: 'now', label: '지금' };
    return { cls: '', label: '대기' };
  }

  function render(skipCard) {
    var d = day();
    if (!d) return;
    $('dayLabel').textContent = d.label;
    $('prevDay').disabled = state.index <= 0;
    $('nextDay').disabled = state.index >= state.days.length - 1;

    var total = d.tasks.length, done = 0;
    for (var i = 0; i < total; i++) if (isDone(d.tasks[i])) done++;
    $('counter').textContent = done + ' / ' + total;
    $('barFill').style.width = total ? Math.round((done / total) * 100) + '%' : '0%';

    var cur = currentTask();
    $('summaryLine').textContent = cur
      ? cur.title + ' (' + (cur.duration || cur.time) + ')'
      : '오늘 할 일을 다 끝냈어요. 수고했어요!';

    if (!skipCard) renderCard();

    var ul = $('allList');
    var html = '';
    for (var k = 0; k < d.tasks.length; k++) {
      var t = d.tasks[k], st = statusOf(t, cur);
      html += '<li><button type="button" class="all-item' + (cur && t.id === cur.id ? ' current' : '') + '" data-task="' + esc(t.id) + '">' +
        '<span class="all-time">' + esc(t.time || '') + '</span>' +
        '<span class="all-text">' + esc(t.title) + '</span>' +
        '<span class="all-status ' + st.cls + '">' + esc(st.label) + '</span></button></li>';
    }
    ul.innerHTML = html;
  }

  /* ---------- actions ---------- */

  function copyText(txt, btn) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).catch(fallback);
    } else {
      fallback();
    }
    var old = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', old);
    btn.classList.add('copied');
    btn.textContent = '복사됨 ✓';
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
      btn.classList.remove('copied');
      btn.textContent = old;
    }, 1600);
  }

  function toggleStep(i) {
    var task = currentTask();
    if (!task) return;
    var s = ts(task.id);
    if (!s.steps) s.steps = [];
    s.steps[i] = !stepDone(task, i);
    saveStore();
    renderCard();
  }

  function finishTask(task) {
    var s = ts(task.id);
    s.done = true;
    s.at = new Date().toISOString();
    if (!s.steps) s.steps = [];
    for (var i = 0; i < task.steps.length; i++) s.steps[i] = true;
    saveStore();

    var d = day(), start = d.tasks.indexOf(task), next = null;
    for (var k = 1; k <= d.tasks.length; k++) {
      var t = d.tasks[(start + k) % d.tasks.length];
      if (!isDone(t)) { next = t; break; }
    }
    state.selected = next ? next.id : null;
    render();
    try {
      $('cardHost').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  }

  function nextOnly(task) {
    var d = day(), start = d.tasks.indexOf(task), next = null;
    for (var k = 1; k <= d.tasks.length; k++) {
      var t = d.tasks[(start + k) % d.tasks.length];
      if (!isDone(t)) { next = t; break; }
    }
    state.selected = next ? next.id : null;
    render();
  }

  function resetDay() {
    var d = day();
    if (!window.confirm(d.label + ' 체크를 모두 지울까요?')) return;
    allStore[d.date] = {};
    state.store = allStore[d.date];
    state.selected = null;
    saveStore();
    render();
  }

  $('cardHost').addEventListener('click', function (e) {
    var t = e.target;
    var stepBtn = t.closest ? t.closest('.step') : null;
    if (stepBtn) { toggleStep(parseInt(stepBtn.getAttribute('data-step'), 10)); return; }

    var copyBtn = t.closest ? t.closest('.copy-btn') : null;
    if (copyBtn) {
      var task = currentTask();
      if (!task) return;
      var c = task.copies[parseInt(copyBtn.getAttribute('data-copy'), 10)];
      if (c) copyText(c.text, copyBtn);
      return;
    }

    var actBtn = t.closest ? t.closest('[data-act]') : null;
    if (actBtn) {
      var act = actBtn.getAttribute('data-act');
      var cur = currentTask();
      if (act === 'finish' && cur) finishTask(cur);
      else if (act === 'next' && cur) nextOnly(cur);
      else if (act === 'review' && day()) { state.selected = day().tasks[0].id; render(); }
      else if (act === 'reset') resetDay();
    }
  });

  $('allList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-task]') : null;
    if (!btn) return;
    state.selected = btn.getAttribute('data-task');
    render();
    try {
      $('cardHost').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      window.scrollTo(0, 0);
    }
  });

  function goDay(delta) {
    var next = state.index + delta;
    if (next < 0 || next >= state.days.length) return;
    state.index = next;
    state.selected = null;
    state.store = storeFor(state.days[next].date);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('prevDay').addEventListener('click', function () { goDay(-1); });
  $('nextDay').addEventListener('click', function () { goDay(1); });

  $('pickleBtn').addEventListener('click', function () { $('sheet').hidden = false; });
  $('sheetClose').addEventListener('click', function () { $('sheet').hidden = true; });
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').hidden = true; });

  /* ---------- boot ---------- */

  function start(data) {
    var days = (data.days || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (!days.length) return fail();
    state.days = days;

    var t = todaySeoul(), idx = -1;
    for (var i = 0; i < days.length; i++) if (days[i].date === t) idx = i;
    if (idx < 0) {
      var best = 0, bestDiff = Infinity;
      for (var j = 0; j < days.length; j++) {
        var diff = Math.abs(new Date(days[j].date + 'T00:00:00Z').getTime() - new Date(t + 'T00:00:00Z').getTime());
        if (diff < bestDiff) { bestDiff = diff; best = j; }
      }
      idx = best;
    }
    state.index = idx;
    state.store = storeFor(days[idx].date);
    render();
  }

  function fail() {
    $('dayLabel').textContent = '불러오기 실패';
    $('cardHost').innerHTML = '<article class="card"><h1 class="card-title">목록을 불러오지 못했어요</h1>' +
      '<p class="card-why">인터넷이 잠깐 끊겼거나 파일이 아직 올라가지 않았어요. 아래 버튼을 눌러 다시 열어 주세요.</p>' +
      '<button type="button" class="cta" onclick="location.reload()">새로고침</button></article>';
  }

  var FALLBACK = null;
  try { FALLBACK = JSON.parse($('fallback-tasks').textContent); } catch (e) { FALLBACK = null; }

  if (window.fetch) {
    fetch('tasks.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.days || !d.days.length) throw new Error('empty');
        start(d);
      })
      .catch(function () {
        if (FALLBACK && FALLBACK.days && FALLBACK.days.length) start(FALLBACK);
        else fail();
      });
  } else if (FALLBACK && FALLBACK.days && FALLBACK.days.length) {
    start(FALLBACK);
  } else {
    fail();
  }
})();
</script>
</body>
</html>
